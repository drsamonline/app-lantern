name: Desktop

# Windows and Linux only. This estate does not ship Apple builds, and a runner
# that produces one would be a build target we do not support.

on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the build tools
        run: npm install --no-audit --no-fund

      - name: The app still passes its own suite
        run: node test-node.js

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Lantern $TAG" --notes "Download the zip for Windows or the AppImage for Linux. The Android build is a reader only — see android/README.md."
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | xargs -0 -r gh release upload "$TAG" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

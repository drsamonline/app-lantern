<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lantern">
  <title>Lantern</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#F0B429" stop-opacity=".42"/>
      <stop offset="55%" stop-color="#F0B429" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#F0B429" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2632"/>
      <stop offset="55%" stop-color="#161C25"/>
      <stop offset="100%" stop-color="#11161D"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="55%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F0902B"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A4553"/>
      <stop offset="100%" stop-color="#232B36"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0D1014"/>
  <circle cx="256" cy="252" r="212" fill="url(#glow)"/>

  <!-- the handle -->
  <path d="M180 150a76 76 0 0 1 152 0" fill="none" stroke="#2B3542" stroke-width="15" stroke-linecap="round"/>
  <path d="M180 150a76 76 0 0 1 152 0" fill="none" stroke="#F0B429" stroke-width="4" stroke-linecap="round" opacity=".5"/>

  <!-- the cap -->
  <rect x="196" y="136" width="120" height="30" rx="10" fill="url(#metal)"/>
  <rect x="216" y="126" width="80" height="14" rx="7" fill="#2B3542"/>

  <!-- the body -->
  <path d="M184 170h144l-12 196a32 32 0 0 1-32 30h-56a32 32 0 0 1-32-30z" fill="url(#body)" stroke="#2B3542" stroke-width="8"/>

  <!-- the light inside -->
  <path d="M256 196c10 22 30 40 34 66a34 34 0 1 1-68 0c4-26 24-44 34-66z" fill="url(#flame)"/>
  <path d="M256 236c6 14 16 24 18 38a18 18 0 1 1-36 0c2-14 12-24 18-38z" fill="#FFF6D8"/>

  <!-- the rails -->
  <path d="M198 176v192M314 176v192" stroke="#2B3542" stroke-width="7" stroke-linecap="round"/>
  <path d="M198 176v192M314 176v192" stroke="#F0B429" stroke-width="2" stroke-linecap="round" opacity=".35"/>

  <!-- the base -->
  <rect x="190" y="392" width="132" height="26" rx="9" fill="url(#metal)"/>
  <rect x="212" y="418" width="88" height="10" rx="5" fill="#2B3542"/>
</svg>

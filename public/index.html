<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern — a library on your Wi-Fi</title>
<meta name="description" content="Lantern — a library served over this Wi-Fi. Browse and search the bundled content with no internet connection at any point.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d1014">
<style>
  :root{
    --bg:#0d1014; --card:#151a21; --ink:#e9ecf1; --mut:#93a0b1;
    --line:#232b36; --acc:#f0b429; --acc-ink:#1a1200;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header,main,footer{max-width:820px;margin:0 auto;padding:18px}
  header{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  h1{margin:0;font-size:22px;letter-spacing:.2px}
  .lamp{width:10px;height:10px;border-radius:50%;background:var(--acc);
        box-shadow:0 0 14px 2px rgba(240,180,41,.55);display:inline-block}
  .mut{color:var(--mut)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px;margin:12px 0}
  input[type=search],input[type=file]{width:100%;background:#0b0f14;color:var(--ink);
        border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit}
  button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;
         padding:10px 14px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:600}
  ul{list-style:none;margin:0;padding:0}
  li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;
     align-items:baseline;justify-content:space-between}
  li:last-child{border-bottom:0}
  a{color:var(--acc);text-decoration:none}
  a:hover{text-decoration:underline}
  .small{font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mut)}
  #reader{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  #reader h2{margin:.2em 0}
  .warn{border-color:#5a3a10;background:#1d1608;color:#ffd591}
  footer{padding-bottom:40px}
</style>
</head>
<body>
<header>
  <h1><img src="icon.svg" alt="" width="26" height="26" style="border-radius:7px;vertical-align:-5px"> Lantern</h1>
  <span class="mut">a library on your Wi-Fi — no internet at any point</span>
</header>

<main>
  <div class="card" id="status-card">
    <div class="row" style="justify-content:space-between">
      <div id="status" class="mut">Opening the library…</div>
      <div class="row">
        <span class="pill" id="here"></span>
        <button class="ghost" id="refresh">Refresh</button>
      </div>
    </div>
  </div>

  <div class="card">
    <input type="search" id="q" placeholder="Search the whole library…" autocomplete="off">
    <div id="hits" class="small mut" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <strong>Packs</strong>
      <span class="mut small" id="packtotal"></span>
    </div>
    <ul id="packs"></ul>
    <div class="row" style="margin-top:12px">
      <input type="file" id="bundle" accept=".json,application/json" style="flex:1 1 240px">
      <button id="import">Import pack</button>
    </div>
    <div id="importmsg" class="small mut" style="margin-top:8px"></div>
  </div>

  <div class="card" id="reader-card" hidden>
    <div class="row" style="justify-content:space-between">
      <strong id="reader-title"></strong>
      <button class="ghost" id="close">Close</button>
    </div>
    <div id="reader"></div>
  </div>
</main>

<footer class="mut small">
  Built with lan-kit · PolyForm Noncommercial 1.0.0 · © 2026 Dr Sohil Momin
</footer>

<script src="lan-kit.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function human(bytes) {
    var n = Number(bytes) || 0;
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  }

  function api(path, opts) {
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (body) {
        if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
        return body;
      });
    });
  }

  function showAddress() {
    var port = location.port || (location.protocol === "https:" ? 443 : 80);
    var el = $("here");
    if (typeof Lan !== "undefined" && Lan.hostUrl) {
      el.textContent = Lan.hostUrl(port).replace(/^https?:\/\//, "");
    } else {
      el.textContent = location.host;
    }
  }

  function loadPacks() {
    return api("/api/packs").then(function (d) {
      var list = $("packs");
      list.innerHTML = "";
      var total = 0;
      if (!d.packs.length) {
        list.innerHTML = '<li class="mut small">No packs yet — import one below.</li>';
      }
      d.packs.forEach(function (p) {
        total += p.bytes;
        var li = document.createElement("li");
        li.innerHTML =
          '<span><strong>' + esc(p.title) + "</strong><br>" +
          '<span class="mut small">' + esc(p.id) + " · " + p.docs +
          " document" + (p.docs === 1 ? "" : "s") + "</span></span>" +
          '<span class="row"><span class="pill">' + human(p.bytes) + "</span>" +
          '<button class="ghost small" data-remove="' + esc(p.id) + '">Remove</button></span>';
        list.appendChild(li);
      });
      $("packtotal").textContent =
        d.packs.length + " pack" + (d.packs.length === 1 ? "" : "s") + " · " +
        d.docs + " document" + (d.docs === 1 ? "" : "s") + " · " + human(total);

      if (d.quarantined && d.quarantined.length) {
        var q = document.createElement("li");
        q.className = "warn small";
        q.textContent = "Quarantined (not served): " + d.quarantined.map(function (x) {
          return x.id + " — " + x.reason;
        }).join("; ");
        list.appendChild(q);
      }
      $("status").textContent = d.packs.length
        ? "Serving " + d.docs + " document(s) to anyone on this Wi-Fi."
        : "The library is empty. Import a pack to serve it.";
    });
  }

  function openDoc(pack, path, title) {
    return fetch("/p/" + encodeURIComponent(pack) + "/" + path.split("/").map(encodeURIComponent).join("/"))
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (text) {
        $("reader-card").hidden = false;
        $("reader-title").textContent = title;
        $("reader").innerHTML = /^\s*</.test(text)
          ? text
          : "<pre style='white-space:pre-wrap'>" + esc(text) + "</pre>";
        $("reader-card").scrollIntoView({ behavior: "smooth", block: "start" });
      });
  }

  function renderHits(d) {
    var box = $("hits");
    if (!d.query) { box.innerHTML = ""; return; }
    if (!d.hits.length) {
      box.innerHTML = "Nothing in the library matches “" + esc(d.query) + "”.";
      return;
    }
    box.innerHTML = d.hits.map(function (h, i) {
      return '<div style="padding:8px 0;border-bottom:1px solid var(--line)">' +
        '<a href="#" data-open="' + esc(h.pack) + "|" + esc(h.path) + "|" + esc(h.title) + '">' +
        esc(h.title) + "</a> " +
        '<span class="pill">' + esc(h.pack) + "</span>" +
        '<div class="mut">' + esc(h.snippet) + "</div></div>";
    }).join("");
  }

  var timer = null;
  $("q").addEventListener("input", function () {
    var q = $("q").value.trim();
    clearTimeout(timer);
    if (!q) { renderHits({ query: "", hits: [] }); return; }
    timer = setTimeout(function () {
      api("/api/search?q=" + encodeURIComponent(q)).then(renderHits).catch(function (e) {
        $("hits").textContent = "Search failed: " + e.message;
      });
    }, 120);
  });

  document.addEventListener("click", function (ev) {
    var open = ev.target.closest("[data-open]");
    if (open) {
      ev.preventDefault();
      var parts = open.getAttribute("data-open").split("|");
      openDoc(parts[0], parts[1], parts[2]);
      return;
    }
    var rm = ev.target.closest("[data-remove]");
    if (rm) {
      var id = rm.getAttribute("data-remove");
      api("/api/packs/" + encodeURIComponent(id), { method: "DELETE" })
        .then(function () {
          $("importmsg").textContent = "Removed " + id + " — its documents are out of search.";
          return loadPacks();
        })
        .catch(function (e) { $("importmsg").textContent = "Could not remove: " + e.message; });
    }
  });

  $("refresh").addEventListener("click", loadPacks);
  $("close").addEventListener("click", function () { $("reader-card").hidden = true; });

  $("import").addEventListener("click", function () {
    var file = $("bundle").files && $("bundle").files[0];
    if (!file) { $("importmsg").textContent = "Choose a pack bundle (.json) first."; return; }
    var reader = new FileReader();
    reader.onload = function () {
      var bundle;
      try {
        bundle = JSON.parse(String(reader.result));
      } catch (e) {
        $("importmsg").textContent = "That file is not a pack bundle: " + e.message;
        return;
      }
      api("/api/packs", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(bundle)
      }).then(function (res) {
        $("importmsg").textContent =
          "Added " + res.id + " — " + res.docs + " document(s), " + human(res.bytes) + ".";
        return loadPacks();
      }).catch(function (e) {
        $("importmsg").textContent = "Pack refused: " + e.message;
      });
    };
    reader.readAsText(file);
  });

  showAddress();
  loadPacks().catch(function (e) {
    $("status").textContent = "The library could not be read: " + e.message;
  });
})();
</script>
</body>
</html>

     (public/ is mounted as the web root). It is NOT a duplicate landing page:
     docs/index.html is the Pages landing page. A page sweep must not delete it -
